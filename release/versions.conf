###############################################################################
# NimoOS release versions — the single source of truth
#
# This is the ONLY file where a version number is edited by hand.
#   - release.sh                reads these versions to build, package and upload
#   - sync-install-script.sh    regenerates the download list in nimoos-install.sh
#   - .github/workflows/release.yml reads it from the *tagged commit* to name and
#     build the GitHub Release — so a version bump must be pushed before the tag
#
# Release procedure:
#   1. Edit the version below, commit and push it to main
#   2. Tag it. A release needs the tag in TWO repositories, both named
#      v<NIMOOS_VERSION>, because two independent channels are triggered by it:
#        - this repository  -> .github/workflows/release.yml -> GitHub Release
#        - nimo_os_docs     -> the local packager -> build, upload to S3, notify
#      nimo_os_docs is a private repository and can never be the public tag
#      target, which is why the tag is duplicated rather than moved.
#      nimo_os_docs/release/tag-release.sh does both from this file's version.
#   3. The rest is automatic: the packager runs release.sh and
#      sync-install-script.sh. Run those by hand only if the CI is down.
#
# This file is sourced by bash: KEY=VALUE only, no spaces around the value.
###############################################################################

# ---------------------------------------------------------------------------
# Object storage and download domain
# ---------------------------------------------------------------------------
# Artifacts live in AWS S3; the install scripts fetch them over HTTPS.
#
# A dedicated bucket holding nothing but published artifacts. It is anonymously
# readable on the prefixes below, which is only safe because nothing private is
# in it — see release/setup-s3-public.sh. The earlier bucket, nimoos-s3-bucket,
# is shared with an unrelated OTA system and stays private.
S3_BUCKET="nimoos-public"
AWS_REGION="us-east-2"
# Key prefix inside the bucket; full object keys look like:
#   s3://<bucket>/<prefix>/<Project>/releases/download/<version>/<tar.gz>
#
# Deliberately not "releases": this bucket is shared with an unrelated OTA
# system that already owns releases/ (its firmware, manifests and per-device
# upgrade logs live there). Keeping NimoOS under its own prefix means the CDN can
# publish our artifacts without exposing theirs, and neither side can overwrite
# the other's manifests. Changing this value moves both the upload target and the
# download URLs — the two are read from here — so it also needs a matching
# s3:PutObject grant on the new prefix.
S3_PREFIX="nimoos"
# Public download domain used by the install scripts.
#
# This is the ONE value to change when the distribution path changes: every
# install script and every fetch helper derives its URLs from it, and
# sync-install-script.sh propagates it into the published nimoos-install.sh.
#
# Today it is the S3 regional endpoint, served straight from the public bucket.
# When CloudFront is available, run setup-s3-cdn.sh — which takes the bucket
# private again and fronts it with an Origin Access Control — and change this to
# the distribution domain in the same commit.
#
# Before the first public release this should become a domain we own, e.g.
# https://get.nimotech.ai/. Whatever is in here gets baked into every installer
# that ships, so a raw amazonaws.com hostname is a provider we could never leave
# without breaking machines already in the field.
DOWNLOAD_DOMAIN="https://nimoos-public.s3.us-east-2.amazonaws.com/"


# ---------------------------------------------------------------------------
# Component versions (edit here when releasing)
# ---------------------------------------------------------------------------
# The NimoOS version line — the only hand-edited value (no leading v)
NIMOOS_VERSION="1.9.4-alpha1"

# Backend Go services
VERSION_GATEWAY="v${NIMOOS_VERSION}"
VERSION_MESSAGEBUS="v${NIMOOS_VERSION}"
VERSION_USERSERVICE="v${NIMOOS_VERSION}"
VERSION_LOCALSTORAGE="v${NIMOOS_VERSION}"
VERSION_APPMANAGEMENT="v${NIMOOS_VERSION}"
VERSION_CORE="v${NIMOOS_VERSION}"
VERSION_CLI="v${NIMOOS_VERSION}"
VERSION_AI="v${NIMOOS_VERSION}"
VERSION_WIKI="v${NIMOOS_VERSION}"
VERSION_SEARCH="v${NIMOOS_VERSION}"
VERSION_PHOTOS="v${NIMOOS_VERSION}"
VERSION_TERMINAL="v${NIMOOS_VERSION}"

# ttyd version bundled with the terminal component (packed into the tarball sysroot)
TTYD_VERSION="1.7.7"

# Python services (architecture-independent packages; venv built at install time)
VERSION_PARSER="v${NIMOOS_VERSION}"
VERSION_AIAGENT="v${NIMOOS_VERSION}"

# Static packages (architecture-independent, linux-all)
VERSION_UI="v${NIMOOS_VERSION}"
VERSION_APPSTORE="v1.0.9"

# Version of the install/uninstall scripts themselves (controls the uninstall URL)
VERSION_INSTALLER="v0.4.17"
