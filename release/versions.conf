###############################################################################
# NimoOS 发布版本 —— 单一版本源 (Single Source of Truth)
#
# 这是整套发布流程中【唯一】需要手动修改版本号的文件。
#   - release.sh            读取这里的版本号进行编译、打包、上传到 OSS
#   - sync-install-script.sh 读取这里的版本号重新生成 nimoos-install.sh 的下载列表
#
# 发版流程:
#   1. 修改下面对应组件的版本号
#   2. ./release.sh --all          # 构建 + 打包 + 上传到深圳 OSS
#   3. ./sync-install-script.sh    # 把新版本号同步进 nimoos-install.sh
#
# 该文件被 bash `source`,格式必须是 KEY=VALUE,值不要带空格。
###############################################################################

# ---------------------------------------------------------------------------
# OSS / 下载域名配置 —— 上传与安装统一走【深圳】
# ---------------------------------------------------------------------------
OSS_BUCKET="nimoos"
OSS_ENDPOINT="oss-cn-shenzhen.aliyuncs.com"
# OSS 内的路径前缀,完整路径形如:
#   oss://<bucket>/<prefix>/<Project>/releases/download/<version>/<tar.gz>
OSS_PREFIX="NimoTech"
# 安装脚本里使用的公网下载域名(必须与上传 bucket 对应的深圳域名一致)
DOWNLOAD_DOMAIN="https://nimoos.oss-cn-shenzhen.aliyuncs.com/"

# ---------------------------------------------------------------------------
# 各组件版本号 (发版时修改这里)
# ---------------------------------------------------------------------------
# NimoOS 主版本线 —— 唯一手改处 (不带 v)
NIMOOS_VERSION="1.9.4-alpha1"

# 后端 Go 服务
VERSION_GATEWAY="v${NIMOOS_VERSION}"
VERSION_MESSAGEBUS="v${NIMOOS_VERSION}"
VERSION_USERSERVICE="v${NIMOOS_VERSION}"
VERSION_LOCALSTORAGE="v${NIMOOS_VERSION}"
VERSION_APPMANAGEMENT="v${NIMOOS_VERSION}"
VERSION_CORE="v${NIMOOS_VERSION}"
VERSION_CLI="v${NIMOOS_VERSION}"
VERSION_AI="v${NIMOOS_VERSION}"
VERSION_WIKI="v${NIMOOS_VERSION}"
VERSION_SEARCH="v${NIMOOS_VERSION}"
VERSION_PHOTOS="v${NIMOOS_VERSION}"
VERSION_TERMINAL="v${NIMOOS_VERSION}"

# 终端组件捆绑的 ttyd 版本 (release 打进 tarball 的 sysroot 并上传 OSS ttyd/<ver>/)
TTYD_VERSION="1.7.7"

# Python 服务 (架构无关源码包 + 安装端建 venv)
VERSION_PARSER="v${NIMOOS_VERSION}"
VERSION_AIAGENT="v${NIMOOS_VERSION}"

# 静态包 (架构无关, linux-all)
VERSION_UI="v${NIMOOS_VERSION}"
VERSION_APPSTORE="v1.0.9"

# 安装/卸载脚本自身版本 (控制 nimoos-install.sh 中的 uninstall 下载地址)
VERSION_INSTALLER="v0.4.17"
